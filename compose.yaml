services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gates
      MYSQL_USER: gates
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      HOST: 0.0.0.0
      WALLET_SERVICE_URL: ${DOCKER_WALLET_SERVICE_URL:-http://host.docker.internal:8000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  indexer:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
    command: ["node", "dist/src/cli.js", "blockchain:index", "--base_gate=eth_sepolia", "--loop"]
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["indexer"]
volumes:
  mysql-data:
